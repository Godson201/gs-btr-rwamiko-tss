databases:
  - name: gs-btr-rwamiko-db
    plan: free
    databaseName: gs_btr_rwamiko
    user: gs_btr_user
    ipAllowList: []

services:
  - type: web
    name: gs-btr-rwamiko-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gs-btr-rwamiko-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://gs-btr-rwamiko-web.onrender.com
      - key: FRONTEND_URL
        value: https://gs-btr-rwamiko-web.onrender.com
      - key: BCRYPT_SALT_ROUNDS
        value: 10
      - key: THROTTLE_TTL
        value: 60
      - key: THROTTLE_LIMIT
        value: 100
      - key: MAX_FILE_SIZE
        value: 10485760
      - key: UPLOAD_PATH
        value: uploads
      - key: MAIL_ENABLED
        value: true
      - key: MAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: MAIL_FROM_NAME
        value: G.S BTR RWAMIKO TSS
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_RESET_PASSWORD
        value: "false"

  - type: web
    name: gs-btr-rwamiko-web
    runtime: docker
    plan: free
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: API_URL
        value: https://gs-btr-rwamiko-api.onrender.com/api
      - key: JWT_SECRET
        fromService:
          type: web
          name: gs-btr-rwamiko-api
          envVarKey: JWT_SECRET
      - key: NODE_ENV
        value: production
