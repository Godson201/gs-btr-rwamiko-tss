version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gs_btr_db
    environment:
      POSTGRES_USER: gs_user
      POSTGRES_PASSWORD: secure_password_here
      POSTGRES_DB: gs_btr_rwamiko
    ports:
      # 5433 avoids conflicts with other local PostgreSQL projects.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gs_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gs_btr_backend
    environment:
      - DATABASE_URL=postgresql://gs_user:secure_password_here@postgres:5432/gs_btr_rwamiko
      - NODE_ENV=development
      - JWT_SECRET=your_super_secret_jwt_key_here
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - gs_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gs_btr_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - gs_network

  nginx:
    image: nginx:alpine
    container_name: gs_btr_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - gs_network

volumes:
  postgres_data:

networks:
  gs_network:
    driver: bridge
